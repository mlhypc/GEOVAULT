[project]
name = "geovault"
version = "0.12.0"
description = "Research-grade satellite tile vault: acquire from free public sources, store lossless, query from anywhere"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mlhypc" }]
keywords = ["satellite", "sentinel", "stac", "cog", "tiles", "duckdb", "parquet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "duckdb>=1.5",
    "pyarrow>=16",
    "numpy>=1.26",
    "pyproj>=3.6",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "rasterio>=1.3",
    "requests>=2.28",
    "shapely>=2.0",
    "urllib3>=1.26",
]

[project.optional-dependencies]
era5 = ["zarr>=3.0", "gcsfs>=2024.0"]                       # ARCO-ERA5 adapter only
cds = ["cdsapi>=0.7", "xarray>=2024.0", "netCDF4>=1.6", "h5netcdf>=1.3"]   # era5land + agera5 (Copernicus CDS account)
syn = ["h5py>=3.10", "fsspec>=2024.0", "aiohttp>=3.9"]                   # s3_syn_v10 adapter (HDF5 chunk reads over HTTP)
pardig = ["zarr>=3.0", "gcsfs>=2024.0", "numcodecs>=0.13"]              # pardig_nrt + pardig_lr (Zarr v3 chunk reads, anonymous GCS)
dev = ["pytest>=8"]                                                      # the test suite; without the cds and pardig extras their tests are skipped

[project.urls]
Homepage = "https://geovault.dev"
Repository = "https://github.com/mlhypc/GEOVAULT"
Changelog = "https://github.com/mlhypc/GEOVAULT/blob/main/CHANGELOG.md"

[project.scripts]
geovault = "geovault.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
