name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20         # the suite takes two to three minutes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # the cds and pardig extras bring what two test modules import; without them
      # those tests are skipped, not failed
      - run: python -m pip install -e ".[dev,cds,pardig]"
      # no network, no account: every test writes to a temporary folder. A test that
      # does not come back within five minutes prints where it stands
      - run: python -m pytest -q -o faulthandler_timeout=300 tests
